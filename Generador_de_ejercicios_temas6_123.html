<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador infinito de ejercicios · Álgebra</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$']] },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
/* VARIABLES Y BASE */
:root {
  --bg:#f4f6fb; --card:#fff; --ink:#111827; --muted:#6b7280;
  --brand:#4f46e5; --brand2:#7c3aed; --line:#e5e7eb;
  --ok:#059669; --okbg:#ecfdf5; --err:#dc2626; --errbg:#fef2f2;
  --warn:#b45309; --warnbg:#fffbeb;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.55;
  padding: 24px 16px 60px;
}
.wrap { max-width: 900px; margin: 0 auto; }
.card {
  background: var(--card);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(17,24,39,0.08);
  overflow: hidden;
}
.card-head {
  background: linear-gradient(135deg, var(--brand), var(--brand2));
  color: #fff;
  padding: 22px 28px;
}
.card-head h1 {
  margin: 0 0 4px;
  font-size: 1.6rem;
  font-weight: 700;
}
.card-head .sub { font-size: 0.95rem; opacity: 0.95; }
.card-body { padding: 22px 28px 26px; }
.topbar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 14px;
}
/* BOTONES */
.btn-primary, .btn-ghost, .btn-soft {
  font-family: inherit;
  font-size: 0.95rem;
  border-radius: 10px;
  padding: 10px 16px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.btn-primary {
  background: var(--brand);
  color: #fff;
  border-color: var(--brand);
}
.btn-primary:hover { background: #4338ca; }
.btn-ghost {
  background: transparent;
  color: var(--brand);
  border-color: var(--line);
}
.btn-ghost:hover { background: #f9fafb; }
.btn-soft {
  background: #eef2ff;
  color: var(--brand);
}
.btn-soft:hover { background: #e0e7ff; }
/* ENTRADA Y FILA */
.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
#respuesta {
  flex: 1;
  min-width: 220px;
  padding: 11px 14px;
  font-size: 1rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-family: inherit;
}
#respuesta:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
}
#enunciado {
  background: #f9fafb;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 16px;
  font-size: 1.02rem;
}
/* FEEDBACK */
.feedback {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 0.95rem;
  display: none;
}
.feedback.visible { display: block; }
.feedback.ok {
  background: var(--okbg);
  border: 1px solid #a7f3d0;
  color: var(--ok);
}
.feedback.err {
  background: var(--errbg);
  border: 1px solid #fecaca;
  color: var(--err);
}
.feedback code {
  background: rgba(255,255,255,0.7);
  padding: 1px 6px;
  border-radius: 4px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
/* PANELES */
.panel {
  margin-top: 14px;
  padding: 14px 16px;
  border-radius: 10px;
  font-size: 0.95rem;
  display: none;
}
.panel.visible { display: block; }
.panel.pista {
  background: var(--warnbg);
  border: 1px solid #fde68a;
  color: var(--warn);
}
.panel.explicacion {
  background: #f5f3ff;
  border: 1px solid #ddd6fe;
  color: #5b21b6;
}
/* MARCADOR */
.marcador {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 22px;
  flex-wrap: wrap;
  align-items: center;
  color: var(--muted);
  font-size: 0.9rem;
}
.marcador b { color: var(--ink); font-weight: 600; }
.kbd {
  display: inline-block;
  padding: 1px 7px;
  background: #fff;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  font-size: 0.8rem;
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
footer {
  text-align: center;
  color: var(--muted);
  font-size: 0.85rem;
  margin-top: 22px;
}
/* RESPONSIVE */
@media (max-width: 560px) {
  .card-head { padding: 18px 18px; }
  .card-body { padding: 16px 16px 20px; }
  .card-head h1 { font-size: 1.3rem; }
  #respuesta { min-width: 100%; }
  .btn-primary, .btn-ghost, .btn-soft { flex: 1; }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="card-head">
        <h1>Generador infinito de ejercicios</h1>
        <div class="sub">Materia: ÁLGEBRA · Tema: Inducción matemática, igualdades, desigualdades, divisibilidad</div>
      </div>
      <div class="card-body">
        <div class="topbar">
          <button class="btn-ghost" id="btnNuevo">Nuevo ejercicio</button>
        </div>
        <div id="enunciado"></div>
        <div class="row">
          <input id="respuesta" type="text" placeholder="Usa ^ para potencias y / para fracciones…" autocomplete="off">
          <button class="btn-primary" id="btnVerificar">Verificar</button>
          <button class="btn-soft" id="btnPista">Pista</button>
          <button class="btn-soft" id="btnExplicacion">Explicación</button>
        </div>
        <div id="feedback" class="feedback"></div>
        <div id="pistaBox" class="panel pista"></div>
        <div id="explicacionBox" class="panel explicacion"></div>
        <div class="marcador">
          Aciertos: <b id="mArc">0</b> · Intentos: <b id="mInt">0</b>
          <span class="legend"><span class="kbd">Enter</span> = verificar · <span class="kbd">N</span> = nuevo</span>
        </div>
      </div>
    </div>
    <footer>Generador aleatorio educativo · ÁLGEBRA · Inducción matemática, igualdades, desigualdades, divisibilidad</footer>
  </div>

<script>
// ============ ESTADO ============
var aciertos = 0, intentos = 0;
var ejercicio = null;

// ============ UTILIDADES ============
function escaparHTML(s) {
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function normalizar(v) {
    v = String(v).toLowerCase().trim();
    v = v.replace(/\$/g, '');
    v = v.replace(/\{/g, '').replace(/\}/g, '');
    v = v.replace(/\s/g, '');
    return v;
}

function aNumero(s) {
    s = String(s).trim().replace(/\s/g, '');
    var m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
    if (m) {
        var num = parseFloat(m[1]);
        var den = parseFloat(m[2]);
        if (den === 0) return NaN;
        return num / den;
    }
    if (/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
    return NaN;
}

function coincideTexto(entrada, acepta) {
    var e = normalizar(entrada);
    for (var i = 0; i < acepta.length; i++) {
        if (normalizar(acepta[i]) === e) return true;
    }
    return false;
}

function tiposet(nodo, intento) {
    intento = intento || 0;
    if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([nodo]);
        return;
    }
    if (intento < 40) {
        setTimeout(function () { tiposet(nodo, intento + 1); }, 200);
    }
}

// ============ GENERADOR ============
function genAlgebra() {
    var v = Math.floor(Math.random() * 6);
    var o = {};

    if (v === 0) {
        // VARIANTE 1: Igualdad — ecuación lineal ax+b = cx+d (numérica)
        var xt = 2 + Math.floor(Math.random() * 6);        // 2..7
        var a = 3 + Math.floor(Math.random() * 3);          // 3..5
        var c = 1 + Math.floor(Math.random() * 2);          // 1..2
        var b = 1 + Math.floor(Math.random() * 5);          // 1..5
        var d = b + (a - c) * xt;
        o.tipo = 'numerica';
        o.problema = 'En la calibración de un brazo robótico del laboratorio de mecatrónica, dos sensores devuelven lecturas \\(' + a + 'x+' + b + '\\) y \\(' + c + 'x+' + d + '\\) voltios para una misma articulación. Halla el valor de \\(x\\) que iguala ambas lecturas.';
        o.solucion = 'x = ' + xt;
        o.respuestaLaTeX = 'x = ' + xt;
        o.acepta = [String(xt), 'x=' + xt];
        o.respuesta = xt;
        o.tolerancia = 0.001;
        o.pista = 'Reordena \\(' + a + 'x+' + b + '=' + c + 'x+' + d + '\\) agrupando las \\(x\\) a un lado y los términos independientes al otro: \\((' + (a - c) + ')x = ' + (d - b) + '\\).';
        o.explicacion = 'Paso 1. Partimos de \\(' + a + 'x+' + b + '=' + c + 'x+' + d + '\\). Paso 2. Restamos \\(' + c + 'x\\) en ambos lados: \\(' + (a - c) + 'x+' + b + '=' + d + '\\). Paso 3. Restamos \\(' + b + '\\): \\(' + (a - c) + 'x=' + (d - b) + '\\). Paso 4. Dividimos entre \\(' + (a - c) + '\\): \\(x=' + xt + '\\).';
    }
    else if (v === 1) {
        // VARIANTE 2: Desigualdad — mayor entero que satisface ax+b <= K (numérica)
        var xt = 2 + Math.floor(Math.random() * 7);         // 2..9
        var a = 2 + Math.floor(Math.random() * 4);          // 2..5
        var b = 1 + Math.floor(Math.random() * 5);          // 1..5
        var K = a * xt + b;
        o.tipo = 'numerica';
        o.problema = 'En un modelo de inteligencia artificial para optimizar el consumo de un dron, el costo \\(C\\) en función del número \\(x\\) de sensores activos cumple \\(C \\le ' + K + '\\) con \\(C = ' + a + 'x + ' + b + '\\). Determina el MAYOR valor entero de \\(x\\) que respeta el límite de costo.';
        o.solucion = 'x = ' + xt;
        o.respuestaLaTeX = 'x = ' + xt;
        o.acepta = [String(xt), 'x=' + xt];
        o.respuesta = xt;
        o.tolerancia = 0.001;
        o.pista = 'Plantea \\(' + a + 'x + ' + b + ' \\le ' + K + '\\) y despeja \\(x\\). Recuerda que se pide el mayor entero compatible con la cota.';
        o.explicacion = 'Paso 1. Inecuencia \\(' + a + 'x + ' + b + ' \\le ' + K + '\\). Paso 2. Restamos \\(' + b + '\\): \\(' + a + 'x \\le ' + (K - b) + '\\). Paso 3. Dividimos entre \\(' + a + '\\): \\(x \\le ' + xt + '\\). Paso 4. El mayor entero que satisface \\(x \\le ' + xt + '\\) es \\(' + xt + '\\).';
    }
    else if (v === 2) {
        // VARIANTE 3: Inducción — suma de los n primeros naturales (simbólica)
        o.tipo = 'simbolica';
        o.problema = 'Ada Lovelace, pionera de la computación, diseñó un algoritmo que recorre \\(n\\) etapas numeradas. Para verificar su complejidad necesita la fórmula cerrada de la suma \\(1 + 2 + 3 + \\cdots + n\\). Da la expresión algebraica del resultado.';
        o.solucion = 'n(n+1)/2';
        o.respuestaLaTeX = '\\dfrac{n(n+1)}{2}';
        o.acepta = ['n(n+1)/2', '(n(n+1))/2', '(n^2+n)/2', 'n*(n+1)/2'];
        o.pista = 'Aplica inducción sobre \\(n\\). Caso base \\(n=1\\) da \\(1\\). Hipótesis inductiva: \\(S(n)=1+2+\\cdots+n\\). Paso inductivo: \\(S(n+1)=S(n)+(n+1)\\).';
        o.explicacion = 'Paso 1. Caso base \\(n=1\\): \\(1=\\dfrac{1(1+1)}{2}=1\\). ✓ Paso 2. Hipótesis: \\(1+2+\\cdots+n=\\dfrac{n(n+1)}{2}\\). Paso 3. Paso inductivo: \\(S(n+1)=S(n)+(n+1)=\\dfrac{n(n+1)}{2}+(n+1)=\\dfrac{(n+1)(n+2)}{2}\\). Paso 4. Se cumple para \\(n+1\\); por inducción, \\(S(n)=\\dfrac{n(n+1)}{2}\\) para todo \\(n\\).';
    }
    else if (v === 3) {
        // VARIANTE 4: Inducción — suma de los n primeros impares (simbólica)
        o.tipo = 'simbolica';
        o.problema = 'En una comunidad zapoteca, una artesana teje un patrón geométrico por capas: la capa \\(k\\) añade \\((2k-1)\\) puntos. Si \\(n\\) es el número de capas, el total de puntos es \\(1 + 3 + 5 + \\cdots + (2n-1)\\). Da la fórmula cerrada.';
        o.solucion = 'n^2';
        o.respuestaLaTeX = 'n^2';
        o.acepta = ['n^2', 'n*n'];
        o.pista = 'Observa el patrón: \\(1=1\\), \\(1+3=4\\), \\(1+3+5=9\\), \\(1+3+5+7=16\\). ¿Qué forma tienen estos resultados? Aplica inducción sobre \\(n\\).';
        o.explicacion = 'Paso 1. Caso base \\(n=1\\): \\(1=1^2\\). ✓ Paso 2. Hipótesis: \\(1+3+\\cdots+(2n-1)=n^2\\). Paso 3. Paso inductivo: \\(S(n+1)=S(n)+(2(n+1)-1)=n^2+(2n+1)=(n+1)^2\\). Paso 4. Se cumple para \\(n+1\\); por inducción, \\(S(n)=n^2\\) para todo \\(n\\).';
    }
    else if (v === 4) {
        // VARIANTE 5: Divisibilidad — cociente (n^3-n)/6 (numérica)
        var n = 2 + Math.floor(Math.random() * 6);          // 2..7
        var q = (n * n * n - n) / 6;
        o.tipo = 'numerica';
        o.problema = 'En un protocolo criptográfico diseñado por la ingeniera María Teresa, se demuestra por inducción que \\(n^3 - n\\) es divisible entre \\(6\\) para todo \\(n\\) natural. Para \\(n=' + n + '\\), ¿cuál es el cociente \\((n^3-n)/6\\)?';
        o.solucion = String(q);
        o.respuestaLaTeX = String(q);
        o.acepta = [String(q)];
        o.respuesta = q;
        o.tolerancia = 0.001;
        o.pista = 'Calcula \\(' + n + '^3-' + n + '\\) y divide entre \\(6\\). Recuerda que \\(n^3-n=(n-1)n(n+1)\\), producto de tres enteros consecutivos.';
        o.explicacion = 'Paso 1. Sustituimos \\(n=' + n + '\\): \\(' + n + '^3-' + n + '=' + (n * n * n) + '-' + n + '=' + (n * n * n - n) + '\\). Paso 2. Dividimos entre \\(6\\): \\(\\dfrac{' + (n * n * n - n) + '}{6}=' + q + '\\). Paso 3. Como \\((n-1)n(n+1)\\) son tres enteros consecutivos, su producto siempre contiene un múltiplo de \\(2\\) y un múltiplo de \\(3\\), garantizando la divisibilidad entre \\(6\\).';
    }
    else {
        // VARIANTE 6: Inducción — suma de cuadrados evaluada en n (numérica)
        var n = 3 + Math.floor(Math.random() * 4);          // 3..6
        var s = n * (n + 1) * (2 * n + 1) / 6;
        o.tipo = 'numerica';
        o.problema = 'En el diseño de un enjambre de robots, la energía total acumulada por \\(n\\) unidades sigue \\(1^2 + 2^2 + \\cdots + n^2\\). La fórmula cerrada demostrable por inducción es \\(\\dfrac{n(n+1)(2n+1)}{6}\\). Para \\(n=' + n + '\\), ¿cuánta energía total se acumula?';
        o.solucion = String(s);
        o.respuestaLaTeX = String(s);
        o.acepta = [String(s)];
        o.respuesta = s;
        o.tolerancia = 0.001;
        o.pista = 'Sustituye \\(n=' + n + '\\) en \\(\\dfrac{n(n+1)(2n+1)}{6}\\) y simplifica paso a paso.';
        o.explicacion = 'Paso 1. Sustituimos \\(n=' + n + '\\): \\(\\dfrac{' + n + '\\cdot(' + (n + 1) + ')\\cdot(2\\cdot' + n + '+1)}{6}\\). Paso 2. Calculamos \\(2n+1=' + (2 * n + 1) + '\\). Paso 3. Producto \\(' + n + '\\cdot' + (n + 1) + '\\cdot' + (2 * n + 1) + '=' + (n * (n + 1) * (2 * n + 1)) + '\\). Paso 4. Dividimos entre \\(6\\): \\(\\dfrac{' + (n * (n + 1) * (2 * n + 1)) + '}{6}=' + s + '\\).';
    }

    return o;
}

// ============ UI ============
function nuevoEjercicio() {
    ejercicio = genAlgebra();
    var enun = document.getElementById('enunciado');
    enun.innerHTML = ejercicio.problema;
    tiposet(enun);
    var inp = document.getElementById('respuesta');
    inp.value = '';
    inp.focus();
    var fb = document.getElementById('feedback');
    fb.className = 'feedback';
    fb.innerHTML = '';
    var pb = document.getElementById('pistaBox');
    pb.className = 'panel pista';
    pb.innerHTML = '';
    var eb = document.getElementById('explicacionBox');
    eb.className = 'panel explicacion';
    eb.innerHTML = '';
}

function verificar() {
    if (!ejercicio) return;
    var entradaRaw = document.getElementById('respuesta').value;
    if (!entradaRaw.trim()) return;
    // Tolerancia de entrada: aceptar prefijos como "x=", "x<=", "x≤", "x>="
    var entrada = entradaRaw.trim()
        .replace(/^\s*[a-zA-Z]\s*=\s*/, '')
        .replace(/^\s*[a-zA-Z]\s*<=\s*/, '')
        .replace(/^\s*[a-zA-Z]\s*>=\s*/, '')
        .replace(/^\s*[a-zA-Z]\s*≤\s*/, '')
        .replace(/^\s*[a-zA-Z]\s*≥\s*/, '')
        .trim();
    intentos++;
    document.getElementById('mInt').textContent = intentos;
    var ok = false;
    if (ejercicio.tipo === 'numerica') {
        var num = aNumero(entrada);
        if (!isNaN(num) && Math.abs(num - ejercicio.respuesta) <= ejercicio.tolerancia) {
            ok = true;
        } else if (coincideTexto(entrada, ejercicio.acepta)) {
            ok = true;
        }
    } else {
        ok = coincideTexto(entrada, ejercicio.acepta);
    }
    var fb = document.getElementById('feedback');
    if (ok) {
        aciertos++;
        document.getElementById('mArc').textContent = aciertos;
        fb.className = 'feedback ok visible';
        fb.innerHTML =
            '<div style="font-weight:600;">✓ ¡Correcto!</div>' +
            '<div>Escribiste: <code>' + escaparHTML(entradaRaw.trim()) + '</code></div>' +
            '<div>En notación matemática: \\(' + ejercicio.respuestaLaTeX + '\\)</div>';
        tiposet(fb);
    } else {
        fb.className = 'feedback err visible';
        fb.innerHTML = '<div>✗ Todavía no. Revisa tu procedimiento o pide una pista.</div>';
    }
}

function mostrarPista() {
    if (!ejercicio) return;
    var p = document.getElementById('pistaBox');
    p.innerHTML = ejercicio.pista;
    p.classList.add('visible');
    tiposet(p);
}

function mostrarExplicacion() {
    if (!ejercicio) return;
    var e = document.getElementById('explicacionBox');
    e.innerHTML = ejercicio.explicacion;
    e.classList.add('visible');
    tiposet(e);
}

// ============ EVENTOS ============
document.getElementById('btnNuevo').addEventListener('click', nuevoEjercicio);
document.getElementById('btnVerificar').addEventListener('click', verificar);
document.getElementById('btnPista').addEventListener('click', mostrarPista);
document.getElementById('btnExplicacion').addEventListener('click', mostrarExplicacion);
document.getElementById('respuesta').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || (e.keyCode || e.which) === 13) {
        verificar();
    }
});
document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if ((e.key === 'n' || e.key === 'N') && tag !== 'input' && tag !== 'textarea') {
        nuevoEjercicio();
    }
});

// ============ ARRANQUE ============
nuevoEjercicio();
</script>
</body>
</html>
