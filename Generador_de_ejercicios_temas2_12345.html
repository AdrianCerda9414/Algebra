<style>
/* ===== VARIABLES Y BASE ===== */
:root{
  --bg:#f4f6fb;--card:#fff;--ink:#111827;--muted:#6b7280;
  --brand:#4f46e5;--brand2:#7c3aed;--line:#e5e7eb;

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.55;padding:24px 16px 60px;

    radial-gradient(800px 600px at 110% 20%,rgba(79,70,229,.10),transparent 65%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(17,24,39,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(17,24,39,.04) 1px,transparent 1px);
  background-size:34px 34px;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 40%,transparent 100%);
          mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 40%,transparent 100%);
}
.wrap{max-width:900px;margin:0 auto;position:relative;z-index:1}
/* ===== TARJETA ===== */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 30px 70px -34px rgba(17,24,39,.45);overflow:hidden;
}
.card-head{
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;padding:24px 28px 22px;position:relative;overflow:hidden;
}
.card-head::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);
  background-size:14px 14px;opacity:.5;
}
.card-head h1{margin:0 0 6px;font-size:clamp(1.4rem,3.5vw,1.7rem);font-weight:700}
.card-head .sub{font-size:.96rem;opacity:.95}

.card-body{padding:22px 28px 26px}
/* ===== TOPBAR ===== */
.topbar{display:flex;justify-content:flex-end;margin-bottom:14px}
.btn-ghost.icono svg{transition:transform .35s ease}
.btn-ghost.icono:hover svg{transform:rotate(180deg)}
/* ===== BOTONES ===== */
.btn-primary,.btn-ghost,.btn-soft{
  font-family:inherit;font-size:.95rem;border-radius:10px;padding:10px 16px;
  cursor:pointer;border:1px solid transparent;font-weight:600;
  transition:transform .12s ease,background .15s,border-color .15s,color .15s;
  display:inline-flex;align-items:center;gap:8px;
}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}
.btn-primary:hover{transform:translateY(-2px)}
.btn-primary:active{transform:scale(.985)}
.btn-ghost{background:transparent;color:var(--brand);border-color:var(--line)}
.btn-ghost:hover{background:#f9fafb;transform:translateY(-2px)}
.btn-soft{background:#eef2ff;color:var(--brand);border-color:transparent}
.btn-soft:hover{background:#e0e7ff;transform:translateY(-2px)}
.btn-primary:focus-visible,.btn-ghost:focus-visible,.btn-soft:focus-visible{
  outline:none;box-shadow:0 0 0 3px rgba(79,70,229,.25);
}

.texto-prob{font-size:1.04rem;line-height:1.6}

.esquema-wrap{
  margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:10px;display:flex;flex-direction:column;align-items:center;
}
.esquema-wrap .caption{font-size:.78rem;color:var(--muted);margin-top:4px;text-align:center}
svg.esquema{display:block;width:100%;max-width:340px;height:auto;aspect-ratio:1/1;
  background:#fff;border-radius:8px;touch-action:none;cursor:grab}
svg.esquema:active{cursor:grabbing}
/* ===== FILA RESPUESTA ===== */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#respuesta{
  flex:1;min-width:220px;padding:11px 14px;font-size:1rem;
  border:1px solid var(--line);border-radius:10px;font-family:inherit;
  transition:border-color .15s,box-shadow .15s;
}
#respuesta:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
#respuesta.mal{border-color:var(--err);animation:sacudir .4s}
@keyframes sacudir{
  0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}
}
/* ===== FEEDBACK ===== */
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.95rem;display:none}
.feedback.visible{display:block;animation:entra .25s ease}
@keyframes entra{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.feedback.ok{background:var(--okbg);border:1px solid #a7f3d0;color:var(--okTit)}
.feedback.err{background:var(--errbg);border:1px solid #fecaca;color:var(--errTit)}
.feedback code{background:rgba(255,255,255,.7);padding:1px 6px;border-radius:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.feedback .titulo{font-weight:600;margin-bottom:4px}
/* ===== PANELES ===== */
.panel{margin-top:14px;padding:14px 16px;border-radius:10px;font-size:.95rem;display:none}
.panel.visible{display:block;animation:entra .25s ease}
.panel.pista{background:var(--warnbg);border:1px solid #fde68a;color:var(--warn)}
.panel.explicacion{background:#f5f3ff;border:1px solid #ddd6fe;color:#5b21b6}
.panel.explicacion .pasos{margin:0;padding:0;list-style:none}
.panel.explicacion .paso{margin:6px 0}
.panel.explicacion .paso b{color:#4c1d95}
.panel.explicacion .respuesta-final{margin-top:10px;padding-top:8px;border-top:1px dashed #c4b5fd;font-weight:600}
/* ===== MARCADOR ===== */
.marcador{
  margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;gap:22px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem;
}
.marcador .stat b{color:var(--ink);font-weight:700;font-size:1.1rem}
.marcador .stat{display:flex;flex-direction:column;line-height:1.1}
.marcador .stat span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.historial{display:flex;gap:4px;flex-wrap:wrap;max-width:200px}
.historial .punto{width:10px;height:10px;border-radius:50%}
.historial .punto.ok{background:var(--ok)}
.historial .punto.err{background:var(--err)}
.historial .punto.vacio{background:#e5e7eb}
.kbd{
  display:inline-block;padding:1px 7px;background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;font-size:.8rem;color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.btn-reset{font-size:.78rem;padding:5px 10px}
/* ===== FOOTER ===== */
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:22px}
/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#e6e9f5}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--brand),var(--brand2));border-radius:6px}

/* ===== RESPALDO LATEX FALLBACK ===== */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1}
.frac .num{border-bottom:1px solid currentColor;padding:0 4px}

/* ===== RESPONSIVE ===== */
@media(max-width:760px){
  .esquema-wrap{max-width:290px;margin-left:auto;margin-right:auto}
}
@media(max-width:560px){
  .card-head{padding:18px 18px}

  #respuesta{grid-column:1/-1;min-width:0}
  .btn-primary{grid-column:1/-1}
  .btn-soft{grid-column:span 1}
  .marcador{gap:14px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

  <div class="wrap">
    <div class="card">

            Nuevo ejercicio

<script>
// ============ ESTADO ============
var aciertos = 0, intentos = 0, racha = 0, historial = [];
var ejercicio = null;
var yaVerificado = false;
var etiquetaActual = '', figuraActual = null;
var varianteAnterior = -1;
var MJ_INTENTOS = 0;

// ============ UTILIDADES ============
function escaparHTML(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normalizar(v){
  v = String(v).toLowerCase().trim();
  v = v.replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i').replace(/ó/g,'o').replace(/ú/g,'u').replace(/ñ/g,'n');
  v = v.replace(/\$/g,'').replace(/\{/g,'').replace(/\}/g,'');
  v = v.replace(/\\left/g,'').replace(/\\right/g,'');
  v = v.replace(/\\[,;!]/g,'').replace(/\\displaystyle/g,'');
  v = v.replace(/\\cdot/g,'*').replace(/\\times/g,'*').replace(/·/g,'*');
  v = v.replace(/°/g,'').replace(/grados/g,'').replace(/deg/g,'');
  v = v.replace(/√/g,'sqrt').replace(/π/g,'pi');
  v = v.replace(/\s/g,'');
  // fracción pura a/b → valor decimal (si es numérica)
  var m = v.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(m){ var num=parseFloat(m[1]), den=parseFloat(m[2]); if(den!==0) v = String(num/den); }
  return v;
}
function limpiarNumero(txt){
  txt = String(txt).toLowerCase().trim();
  txt = txt.replace(/\\frac\{(-?\d+(?:\.\d+)?)\}\{(-?\d+(?:\.\d+)?)\}/g,'($1/$2)');
  txt = txt.replace(/\\dfrac\{(-?\d+(?:\.\d+)?)\}\{(-?\d+(?:\.\d+)?)\}/g,'($1/$2)');
  txt = txt.replace(/\\tfrac\{(-?\d+(?:\.\d+)?)\}\{(-?\d+(?:\.\d+)?)\}/g,'($1/$2)');
  txt = txt.replace(/√/g,'sqrt').replace(/\\sqrt/g,'sqrt');
  txt = txt.replace(/π/g,'pi').replace(/\\pi/g,'pi');
  txt = txt.replace(/°/g,'').replace(/grados/g,'').replace(/deg/g,'');
  txt = txt.replace(/,/g,'.');
  txt = txt.replace(/\s/g,'');
  return txt;
}
// Evaluador aritmético SEGURO (descenso recursivo, sin eval)
function aNumero(txt){
  txt = limpiarNumero(txt);
  if(txt === '') return NaN;
  var p = {s:txt, i:0};
  try{
    var v = _expr(p);
    if(p.i < p.s.length) return NaN;
    if(!isFinite(v)) return NaN;
    return v;
  }catch(e){ return NaN; }
}
function _expr(p){
  var v = _term(p);
  while(p.i < p.s.length && (p.s[p.i]==='+'||p.s[p.i]==='-')){
    var op = p.s[p.i++]; var t = _term(p);
    v = (op==='+')? v+t : v-t;
  }
  return v;
}
function _term(p){
  var v = _power(p);
  while(p.i < p.s.length && (p.s[p.i]==='*'||p.s[p.i]==='/'||_implMult(p))){
    var op = p.s[p.i];
    if(op==='*'||op==='/') p.i++;
    var t = _power(p);
    if(op==='/'){ if(t===0) return NaN; v=v/t; } else v=v*t;
  }
  return v;
}
function _implMult(p){
  if(p.i>=p.s.length) return false;
  var c = p.s[p.i];
  if(c==='('||c==='s'||c==='p'){
    var prev = p.i>0? p.s[p.i-1] : '';
    return prev && (prev>='0'&&prev<='9' || prev===')');
  }
  return false;
}
function _power(p){
  var v = _unary(p);
  if(p.i < p.s.length && p.s[p.i]==='^'){
    p.i++;
    var e = _unary(p);
    v = Math.pow(v,e);
  }
  return v;
}
function _unary(p){
  if(p.i < p.s.length && p.s[p.i]==='-'){ p.i++; return -_unary(p); }
  if(p.i < p.s.length && p.s[p.i]==='+'){ p.i++; return _unary(p); }
  return _primary(p);
}
function _primary(p){
  if(p.i>=p.s.length) return NaN;
  var c = p.s[p.i];
  if(c==='('){
    p.i++;
    var v = _expr(p);
    if(p.i<p.s.length && p.s[p.i]===')') p.i++;
    return v;
  }
  if(c>='0'&&c<='9'){
    var num='';
    while(p.i<p.s.length && ((_esDig(p.s[p.i]))||p.s[p.i]==='.')){ num+=p.s[p.i++]; }
    return parseFloat(num);
  }
  if(p.s.substr(p.i,4)==='sqrt'){
    p.i+=4;
    if(p.i<p.s.length && p.s[p.i]==='('){
      p.i++; var a=_expr(p);
      if(p.i<p.s.length && p.s[p.i]===')') p.i++;
      if(a<0) return NaN;
      return Math.sqrt(a);
    }
    return NaN;
  }
  if(p.s.substr(p.i,2)==='pi'){ p.i+=2; return Math.PI; }
  return NaN;
}
function _esDig(c){ return c>='0'&&c<='9'; }
// Parser de número complejo en texto plano
function parseComplejo(s){
  s = String(s).trim().toLowerCase().replace(/\s/g,'').replace(/\*/g,'').replace(/j/g,'i').replace(/\(/g,'').replace(/\)/g,'');
  if(s==='') return null;
  if(s==='i'||s==='+i') return {re:0,im:1};
  if(s==='-i') return {re:0,im:-1};
  if(s.indexOf('i')===-1){ var n=aNumero(s); return isNaN(n)?null:{re:n,im:0}; }
  if(s.charAt(s.length-1)!=='i') return null;
  var rest = s.substring(0,s.length-1);
  var signIdx=-1;
  for(var k=rest.length-1;k>0;k--){
    if(rest[k]==='+'||rest[k]==='-'){ signIdx=k; break; }
  }
  var reStr, imStr;
  if(signIdx===-1){ reStr='0'; imStr=rest; }
  else { reStr=rest.substring(0,signIdx); imStr=rest.substring(signIdx); }
  if(imStr===''||imStr==='+') imStr='+1';
  if(imStr==='-') imStr='-1';
  var re=aNumero(reStr), im=aNumero(imStr);
  if(isNaN(re)||isNaN(im)) return null;
  return {re:re,im:im};
}
// Parser de ángulo: admite "30", "30°", "pi/6", "3pi/4"
function parseAngulo(txt){
  txt = String(txt).trim().toLowerCase().replace(/\s/g,'').replace(/°/g,'').replace(/grados/g,'').replace(/deg/g,'').replace(/sen/g,'sin');
  if(txt.indexOf('pi')!==-1){
    var rad = aNumero(txt);
    if(isNaN(rad)) return NaN;
    return rad*180/Math.PI;
  }
  return aNumero(txt);
}
// Parser de forma polar: r(cosθ+i sinθ), rcisθ, r∠θ
function parsePolar(txt){
  txt = String(txt).toLowerCase().replace(/\s/g,'').replace(/°/g,'').replace(/grados/g,'').replace(/sen/g,'sin');
  // rcisθ
  var m = txt.match(/^(.+?)cis(.+)$/);
  if(m){ return {r:aNumero(m[1]), ang:parseAngulo(m[2])}; }
  // r∠θ
  m = txt.match(/^(.+?)∠(.+)$/);
  if(m){ return {r:aNumero(m[1]), ang:parseAngulo(m[2])}; }
  // r(cosθ+isinθ)
  m = txt.match(/^(.+?)\(cos(.+?)\+isin(.+?)\)$/);
  if(m){ return {r:aNumero(m[1]), ang:parseAngulo(m[2])}; }
  // r(cosθ+i sinθ)
  m = txt.match(/^(.+?)\(cos(.+?)\+i\*?sin(.+?)\)$/);
  if(m){ return {r:aNumero(m[1]), ang:parseAngulo(m[2])}; }
  // r(cosθ+i senθ) (ya normalizado sin)
  m = txt.match(/^(.+?)\(cos(.+?)\+isin(.+?)\)$/);
  if(m){ return {r:aNumero(m[1]), ang:parseAngulo(m[2])}; }
  return null;
}
// Comparadores
function coincideTexto(entrada, acepta){
  var e = normalizar(entrada);
  for(var i=0;i<acepta.length;i++){
    if(normalizar(acepta[i])===e) return true;
    // igualdad numérica
    var n1 = aNumero(entrada), n2 = aNumero(acepta[i]);
    if(!isNaN(n1)&&!isNaN(n2)&&Math.abs(n1-n2)<=0.002) return true;
  }
  return false;
}
function coincideComplejo(entrada, re, im, tol){
  var p = parseComplejo(entrada);
  if(!p) return false;
  tol = tol||0.002;
  return Math.abs(p.re-re)<=tol && Math.abs(p.im-im)<=tol;
}
function coincidePolar(entrada, r, ang, tol){
  var p = parsePolar(entrada);
  if(!p||isNaN(p.r)||isNaN(p.ang)) return false;
  tol = tol||0.5;
  // normalizar ang a (-180,180]
  var a1 = ((p.ang%360)+360)%360; if(a1>180) a1-=360;
  var a2 = ((ang%360)+360)%360; if(a2>180) a2-=360;
  return Math.abs(p.r-r)<=tol && Math.abs(a1-a2)<=tol;
}
function coincideAngulo(entrada, ang, tol){
  var a = parseAngulo(entrada);
  if(isNaN(a)) return false;
  tol = tol||0.5;
  var a1 = ((a%360)+360)%360; if(a1>180) a1-=360;
  var a2 = ((ang%360)+360)%360; if(a2>180) a2-=360;
  return Math.abs(a1-a2)<=tol;
}
// MathJax typeset con respaldo
function tiposet(nodo, intento){
  intento = intento||0;
  if(window.__mjFallo){ _respaldoLaTeX(nodo); return; }

// Respaldo LaTeX→HTML sin conexión
function _respaldoLaTeX(nodo){
  var walker = document.createTreeWalker(nodo, NodeFilter.SHOW_TEXT, null);
  var nodos = [];
  while(walker.nextNode()){
    var n = walker.currentNode;
    var tag = n.parentNode.tagName.toLowerCase();
    if(['code','pre','script','style','textarea'].indexOf(tag)!==-1) continue;
    if(n.parentNode.dataset && n.parentNode.dataset.mj) continue;
    nodos.push(n);
  }
  for(var i=0;i<nodos.length;i++){
    var t = nodos[i].nodeValue;
    if(t.indexOf('$')===-1 && t.indexOf('\\(')===-1) continue;
    nodos[i].nodeValue = '';
    var span = document.createElement('span');
    span.dataset.mj = '1';
    span.innerHTML = _latexAHTML(t);
    nodos[i].parentNode.replaceChild(span, nodos[i]);
  }
}
function _latexAHTML(texto){
  return texto.replace(/\$([^$]+)\$|\\\((.+?)\\\)/g, function(m, p1, p2){
    return _texAHTML(p1||p2);
  });
}
function _texAHTML(tex){
  tex = tex.replace(/\\left/g,'').replace(/\\right/g,'')
           .replace(/\\bigl/g,'').replace(/\\bigr/g,'')
           .replace(/\\Bigl/g,'').replace(/\\Bigr/g,'')
           .replace(/\\[,;!]/g,'').replace(/\\displaystyle/g,'');
  tex = tex.replace(/\\text\{([^}]*)\}/g,'$1')
           .replace(/\\mathrm\{([^}]*)\}/g,'$1')
           .replace(/\\mathbf\{([^}]*)\}/g,'<b>$1</b>')
           .replace(/\\operatorname\{([^}]*)\}/g,'$1');
  // fracciones (simple, un nivel)
  tex = tex.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, function(m,a,b){
    return '<span class="frac"><span class="num">'+a+'</span><span class="den">'+b+'</span></span>';
  });
  // raíz
  tex = tex.replace(/\\sqrt\{([^{}]*)\}/g, function(m,a){
    return '<span class="sqrt-wrap">'+a+'</span>';
  });
  // símbolos
  tex = tex.replace(/\\cdot/g,'·').replace(/\\times/g,'×')
           .replace(/\\theta/g,'θ').replace(/\\tau/g,'τ').replace(/\\pi/g,'π')
           .replace(/\\le/g,'≤').replace(/\\ge/g,'≥').replace(/\\neq/g,'≠')
           .replace(/\\lt/g,'&lt;').replace(/\\gt/g,'&gt;')
           .replace(/\\to/g,'→').replace(/\\circ/g,'°').replace(/\\alpha/g,'α')
           .replace(/\\beta/g,'β').replace(/\\gamma/g,'γ').replace(/\\phi/g,'φ')
           .replace(/\\lambda/g,'λ').replace(/\\mu/g,'μ').replace(/\\in/g,'∈')
           .replace(/\\subset/g,'⊂').replace(/\\mathbb\{N\}/g,'ℕ')
           .replace(/\\mathbb\{Z\}/g,'ℤ').replace(/\\mathbb\{Q\}/g,'ℚ')
           .replace(/\\mathbb\{R\}/g,'ℝ').replace(/\\mathbb\{C\}/g,'ℂ')
           .replace(/\\setminus/g,'∖').replace(/\\gcd/g,'gcd').replace(/\\cos/g,'cos')
           .replace(/\\sin/g,'sen').replace(/\\tan/g,'tan').replace(/\\arg/g,'arg');
  // acentos
  tex = tex.replace(/\\vec\{([^}]*)\}/g,'<span class="vec-wrap">$1</span>')
           .replace(/\\hat\{([^}]*)\}/g,'<span style="text-decoration:overline">$1</span>')
           .replace(/\\bar\{([^}]*)\}/g,'<span style="text-decoration:overline">$1</span>');
  // super/sub
  tex = tex.replace(/\^\{([^{}]*)\}/g,'<sup>$1</sup>')
           .replace(/\^(\w)/g,'<sup>$1</sup>')
           .replace(/_\{([^{}]*)\}/g,'<sub>$1</sub>')
           .replace(/_(\w)/g,'<sub>$1</sub>');
  tex = tex.replace(/\{/g,'').replace(/\}/g,'');
  return tex;
}

function fraccionStr(n,d){
  if(d===0) return '0';
  var g = mcd(n,d);
  n/=g; d/=g;
  if(d<0){ n=-n; d=-d; }
  return n + '/' + d;
}
function latexComplejo(re, im){
  if(im===0) return String(re);
  if(re===0){
    if(im===1) return 'i';
    if(im===-1) return '-i';

  }

  var absI = Math.abs(im);
  if(absI===1) return re + sign + 'i';
  return re + sign + absI + 'i';
}

// ============ ESQUEMA (plano de Argand) ============
function dibujarEsquema(){
  var svg = document.getElementById('esquema');
  if(!svg || !figuraActual) return;
  var W = 300, H = 300;
  var fig = figuraActual;
  // Calcular bounds de todos los puntos
  var pts = [];
  if(fig.tipo==='punto'){ pts.push({x:fig.x,y:fig.y}); pts.push({x:0,y:0}); }
  else if(fig.tipo==='argumento'){ pts.push({x:fig.x,y:fig.y}); pts.push({x:0,y:0}); }
  else if(fig.tipo==='puntos'){ for(var i=0;i<fig.pts.length;i++) pts.push(fig.pts[i]); pts.push({x:0,y:0}); }
  else if(fig.tipo==='polar'){ pts.push({x:fig.r*Math.cos(fig.ang*Math.PI/180), y:fig.r*Math.sin(fig.ang*Math.PI/180)}); pts.push({x:0,y:0}); }
  else if(fig.tipo==='circulo'){ pts.push({x:fig.cx+fig.r,y:fig.cy}); pts.push({x:fig.cx-fig.r,y:fig.cy}); pts.push({x:fig.cx,y:fig.cy+fig.r}); pts.push({x:fig.cx,y:fig.cy-fig.r}); }
  else if(fig.tipo==='mediatriz'){ pts.push(fig.p1); pts.push(fig.p2); pts.push({x:0,y:0}); }
  else if(fig.tipo==='region_disco' || fig.tipo==='region_disco_aguj'){ var rr = fig.r; pts.push({x:fig.cx+rr,y:fig.cy}); pts.push({x:fig.cx-rr,y:fig.cy}); pts.push({x:fig.cx,y:fig.cy+rr}); pts.push({x:fig.cx,y:fig.cy-rr}); }
  else if(fig.tipo==='region_anillo'){ var rR=fig.r2; pts.push({x:fig.cx+rR,y:fig.cy}); pts.push({x:fig.cx-rR,y:fig.cy}); pts.push({x:fig.cx,y:fig.cy+rR}); pts.push({x:fig.cx,y:fig.cy-rR}); }
  else if(fig.tipo==='region_semi'){ var kk=Math.abs(fig.k)+1; pts.push({x:kk,y:kk}); pts.push({x:-kk,y:-kk}); }
  else if(fig.tipo==='region_franja'){ var fK=Math.max(Math.abs(fig.a),Math.abs(fig.b))+1; pts.push({x:fK,y:fK}); pts.push({x:-fK,y:-fK}); if(fig.eje==='Re'){ pts.push({x:fig.a,y:0}); pts.push({x:fig.b,y:0}); } else { pts.push({x:0,y:fig.a}); pts.push({x:0,y:fig.b}); } }
  // Bounds
  var minX=0,maxX=0,minY=0,maxY=0;
  for(var i=0;i<pts.length;i++){
    var p = pts[i];
    if(p.x<minX) minX=p.x; if(p.x>maxX) maxX=p.x;
    if(p.y<minY) minY=p.y; if(p.y>maxY) maxY=p.y;
  }
  var absMax = Math.max(Math.abs(minX),Math.abs(maxX),Math.abs(minY),Math.abs(maxY),1);
  absMax = Math.max(absMax, 1) * 1.25;
  var scale = (Math.min(W,H)/2 - 30) / absMax;
  var cx = W/2, cy = H/2;
  function X(x){ return cx + x*scale; }
  function Y(y){ return cy - y*scale; } // invertir eje y
  var svgNS = 'http://www.w3.org/2000/svg';
  var html = '';
  // Fondo
  html += '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fff" rx="6"/>';
  // Retícula
  var paso = scale;
  for(var k=-absMax; k<=absMax; k+=1){
    if(Math.abs(k)<0.001) continue;
    html += '<line x1="'+X(k)+'" y1="'+Y(-absMax)+'" x2="'+X(k)+'" y2="'+Y(absMax)+'" stroke="#eef2ff" stroke-width="1"/>';
    html += '<line x1="'+X(-absMax)+'" y1="'+Y(k)+'" x2="'+X(absMax)+'" y2="'+Y(k)+'" stroke="#eef2ff" stroke-width="1"/>';
  }
  // Ejes
  html += '<line x1="'+X(-absMax)+'" y1="'+Y(0)+'" x2="'+X(absMax)+'" y2="'+Y(0)+'" stroke="#94a3b8" stroke-width="1.5"/>';
  html += '<line x1="'+X(0)+'" y1="'+Y(-absMax)+'" x2="'+X(0)+'" y2="'+Y(absMax)+'" stroke="#94a3b8" stroke-width="1.5"/>';
  // Etiquetas ejes
  html += '<text x="'+(W-12)+'" y="'+(Y(0)-4)+'" font-size="10" fill="#64748b" text-anchor="end">Re</text>';
  html += '<text x="'+(X(0)+6)+'" y="14" font-size="10" fill="#64748b">Im</text>';
  // Marcas enteras
  var intMax = Math.floor(absMax);
  for(var k=1;k<=intMax;k++){
    html += '<line x1="'+X(k)+'" y1="'+Y(0)-3+'" x2="'+X(k)+'" y2="'+Y(0)+3+'" stroke="#94a3b8" stroke-width="1"/>';
    html += '<line x1="'+X(-k)+'" y1="'+Y(0)-3+'" x2="'+X(-k)+'" y2="'+Y(0)+3+'" stroke="#94a3b8" stroke-width="1"/>';
    html += '<line x1="'+X(0)-3+'" y1="'+Y(k)+'" x2="'+X(0)+3+'" y2="'+Y(k)+'" stroke="#94a3b8" stroke-width="1"/>';
    html += '<line x1="'+X(0)-3+'" y1="'+Y(-k)+'" x2="'+X(0)+3+'" y2="'+Y(-k)+'" stroke="#94a3b8" stroke-width="1"/>';
  }
  // Dibujar según tipo
  if(fig.tipo==='punto'){
    var px = X(fig.x), py = Y(fig.y);
    html += '<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+px+'" y2="'+py+'" stroke="#7c3aed" stroke-width="1.8"/>';
    html += '<circle cx="'+px+'" cy="'+py+'" r="4" fill="#7c3aed"/>';
    html += '<text x="'+(px+6)+'" y="'+(py-6)+'" font-size="12" fill="#4c1d95" font-style="italic">'+(fig.label||'z')+'</text>';
  }
  else if(fig.tipo==='argumento'){
    var px = X(fig.x), py = Y(fig.y);
    var rad = Math.sqrt(fig.x*fig.x+fig.y*fig.y);
    var arcR = Math.min(scale*0.6, 40);
    var ang = Math.atan2(fig.y, fig.x) * 180/Math.PI;
    if(ang<0) ang += 360;
    var arc = describeArco(X(0), Y(0), arcR, 0, ang);
    html += arc;
    html += '<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+px+'" y2="'+py+'" stroke="#7c3aed" stroke-width="1.8"/>';
    html += '<circle cx="'+px+'" cy="'+py+'" r="4" fill="#7c3aed"/>';
    html += '<text x="'+(px+6)+'" y="'+(py-6)+'" font-size="12" fill="#4c1d95" font-style="italic">'+(fig.label||'z')+'</text>';
    html += '<text x="'+(X(0)+arcR*0.7*Math.cos(ang/2*Math.PI/180)+6)+'" y="'+(Y(0)-arcR*0.7*Math.sin(ang/2*Math.PI/180))+'" font-size="11" fill="#b45309" font-style="italic">θ</text>';
  }
  else if(fig.tipo==='puntos'){
    var colors = ['#4f46e5','#7c3aed','#dc2626','#059669'];
    for(var i=0;i<fig.pts.length;i++){
      var p = fig.pts[i];
      var px = X(p.x), py = Y(p.y);
      html += '<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+px+'" y2="'+py+'" stroke="'+colors[i%colors.length]+'" stroke-width="1.5" opacity="0.7"/>';
      html += '<circle cx="'+px+'" cy="'+py+'" r="4" fill="'+colors[i%colors.length]+'"/>';
      html += '<text x="'+(px+6)+'" y="'+(py-6)+'" font-size="12" fill="#1f2937" font-style="italic">'+(p.label||('z'+(i+1)))+'</text>';
    }
    if(fig.segmento && fig.pts.length>=2){
      html += '<line x1="'+X(fig.pts[0].x)+'" y1="'+Y(fig.pts[0].y)+'" x2="'+X(fig.pts[1].x)+'" y2="'+Y(fig.pts[1].y)+'" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>';
    }
    if(fig.mid){
      html += '<circle cx="'+X(fig.mid.x)+'" cy="'+Y(fig.mid.y)+'" r="3" fill="#059669"/>';
    }
  }
  else if(fig.tipo==='polar'){
    var px = X(fig.r*Math.cos(fig.ang*Math.PI/180));
    var py = Y(fig.r*Math.sin(fig.ang*Math.PI/180));
    var arcR = 28;
    var arc = describeArco(X(0), Y(0), arcR, 0, fig.ang);
    html += arc;
    html += '<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+px+'" y2="'+py+'" stroke="#7c3aed" stroke-width="1.8"/>';
    html += '<circle cx="'+px+'" cy="'+py+'" r="4" fill="#7c3aed"/>';
    html += '<text x="'+(px+6)+'" y="'+(py-6)+'" font-size="12" fill="#4c1d95" font-style="italic">z</text>';
    if(typeof fig.extraAng !== 'undefined'){
      var ex = fig.r*Math.cos(fig.extraAng*Math.PI/180);
      var ey = fig.r*Math.sin(fig.extraAng*Math.PI/180);
      html += '<circle cx="'+X(ex)+'" cy="'+Y(ey)+'" r="3" fill="#059669" opacity="0.7"/>';
      html += '<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(ex)+'" y2="'+Y(ey)+'" stroke="#059669" stroke-width="1.2" opacity="0.5" stroke-dasharray="3,3"/>';
    }
  }
  else if(fig.tipo==='circulo'){
    var ccx = X(fig.cx), ccy = Y(fig.cy);
    var rad = fig.r * scale;
    html += '<circle cx="'+ccx+'" cy="'+ccy+'" r="'+rad+'" fill="rgba(124,58,237,0.10)" stroke="#7c3aed" stroke-width="1.8"/>';
    html += '<circle cx="'+ccx+'" cy="'+ccy+'" r="3" fill="#7c3aed"/>';
    if(fig.raices){
      var n = fig.n;
      for(var k=0;k<n;k++){
        var a = k*360/n;
        var rx = fig.cx + fig.r*Math.cos(a*Math.PI/180);
        var ry = fig.cy + fig.r*Math.sin(a*Math.PI/180);
        html += '<circle cx="'+X(rx)+'" cy="'+Y(ry)+'" r="2.5" fill="#dc2626" opacity="0.5"/>';
      }
    }
  }
  else if(fig.tipo==='mediatriz'){
    var p1 = fig.p1, p2 = fig.p2;
    var mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
    var dx = p2.x-p1.x, dy = p2.y-p1.y;
    var len = Math.sqrt(dx*dx+dy*dy);
    if(len<0.001) len = 1;
    // perpendicular direction
    var nx = -dy/len, ny = dx/len;
    var ext = absMax*1.3;
    html += '<line x1="'+X(p1.x)+'" y1="'+Y(p1.y)+'" x2="'+X(p2.x)+'" y2="'+Y(p2.y)+'" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>';
    html += '<line x1="'+X(mx-nx*ext)+'" y1="'+Y(my-ny*ext)+'" x2="'+X(mx+nx*ext)+'" y2="'+Y(my+ny*ext)+'" stroke="#dc2626" stroke-width="1.8"/>';
    html += '<circle cx="'+X(p1.x)+'" cy="'+Y(p1.y)+'" r="4" fill="#4f46e5"/>';
    html += '<circle cx="'+X(p2.x)+'" cy="'+Y(p2.y)+'" r="4" fill="#4f46e5"/>';
    html += '<text x="'+(X(p1.x)+6)+'" y="'+(Y(p1.y)-6)+'" font-size="12" fill="#1f2937" font-style="italic">'+p1.label+'</text>';
    html += '<text x="'+(X(p2.x)+6)+'" y="'+(Y(p2.y)-6)+'" font-size="12" fill="#1f2937" font-style="italic">'+p2.label+'</text>';
    html += '<circle cx="'+X(mx)+'" cy="'+Y(my)+'" r="3" fill="#059669"/>';
  }
  else if(fig.tipo==='region_disco'){
    var ccx = X(fig.cx), ccy = Y(fig.cy);
    var rad = fig.r * scale;
    var fillC = fig.cerrado ? 'rgba(124,58,237,0.18)' : 'rgba(124,58,237,0.10)';
    var strokeC = fig.cerrado ? '#7c3aed' : '#7c3aed';
    var dash = fig.cerrado ? '' : 'stroke-dasharray="4,3"';
    html += '<circle cx="'+ccx+'" cy="'+ccy+'" r="'+rad+'" fill="'+fillC+'" stroke="'+strokeC+'" stroke-width="1.8" '+dash+'/>';
    html += '<circle cx="'+ccx+'" cy="'+ccy+'" r="3" fill="#7c3aed"/>';
    html += '<text x="'+(ccx+6)+'" y="'+(ccy-6)+'" font-size="11" fill="#4c1d95" font-style="italic">z₀</text>';
  }
  else if(fig.tipo==='region_anillo'){
    var ccx = X(fig.cx), ccy = Y(fig.cy);
    var r1px = fig.r1 * scale, r2px = fig.r2 * scale;
    // Disco exterior relleno
    html += '<circle cx="'+ccx+'" cy="'+ccy+'" r="'+r2px+'" fill="rgba(124,58,237,0.18)" stroke="#7c3aed" stroke-width="1.8"/>';
    // "Agujero" interior: tapar con blanco
    html += '<circle cx="'+ccx+'" cy="'+ccy+'" r="'+r1px+'" fill="#fff" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="3,2"/>';
    html += '<circle cx="'+ccx+'" cy="'+ccy+'" r="3" fill="#7c3aed"/>';
    html += '<text x="'+(ccx+6)+'" y="'+(ccy-6)+'" font-size="11" fill="#4c1d95" font-style="italic">z₀</text>';
  }
  else if(fig.tipo==='region_disco_aguj'){
    var ccx = X(fig.cx), ccy = Y(fig.cy);
    var rad = fig.r * scale;
    html += '<circle cx="'+ccx+'" cy="'+ccy+'" r="'+rad+'" fill="rgba(124,58,237,0.18)" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4,3"/>';
    // Marca el centro excluido con una X
    html += '<circle cx="'+ccx+'" cy="'+ccy+'" r="4" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>';
    html += '<line x1="'+(ccx-3)+'" y1="'+(ccy-3)+'" x2="'+(ccx+3)+'" y2="'+(ccy+3)+'" stroke="#dc2626" stroke-width="1.4"/>';
    html += '<line x1="'+(ccx-3)+'" y1="'+(ccy+3)+'" x2="'+(ccx+3)+'" y2="'+(ccy-3)+'" stroke="#dc2626" stroke-width="1.4"/>';
  }
  else if(fig.tipo==='region_semi'){
    var kpx = fig.k;
    // Rectángulo que cubre el semiplano
    var fill = 'rgba(124,58,237,0.15)';
    var ext = absMax*1.3;
    if(fig.eje==='Re'){
      if(fig.op==='>'){
        html += '<rect x="'+X(kpx)+'" y="'+Y(ext)+'" width="'+(X(ext)-X(kpx))+'" height="'+(Y(-ext)-Y(ext))+'" fill="'+fill+'"/>';
      } else {
        html += '<rect x="'+X(-ext)+'" y="'+Y(ext)+'" width="'+(X(kpx)-X(-ext))+'" height="'+(Y(-ext)-Y(ext))+'" fill="'+fill+'"/>';
      }
      html += '<line x1="'+X(kpx)+'" y1="'+Y(-ext)+'" x2="'+X(kpx)+'" y2="'+Y(ext)+'" stroke="#7c3aed" stroke-width="1.8"/>';
      html += '<text x="'+(X(kpx)+6)+'" y="'+(Y(ext)+12)+'" font-size="11" fill="#4c1d95">Re='+fig.k+'</text>';
    } else {
      if(fig.op==='>'){
        html += '<rect x="'+X(-ext)+'" y="'+Y(ext)+'" width="'+(X(ext)-X(-ext))+'" height="'+(Y(kpx)-Y(ext))+'" fill="'+fill+'"/>';
      } else {
        html += '<rect x="'+X(-ext)+'" y="'+Y(kpx)+'" width="'+(X(ext)-X(-ext))+'" height="'+(Y(-ext)-Y(kpx))+'" fill="'+fill+'"/>';
      }
      html += '<line x1="'+X(-ext)+'" y1="'+Y(kpx)+'" x2="'+X(ext)+'" y2="'+Y(kpx)+'" stroke="#7c3aed" stroke-width="1.8"/>';
      html += '<text x="'+(X(ext)-50)+'" y="'+(Y(kpx)-4)+'" font-size="11" fill="#4c1d95">Im='+fig.k+'</text>';
    }
  }
  else if(fig.tipo==='region_franja'){
    var fill = 'rgba(124,58,237,0.18)';
    var ext = absMax*1.3;
    if(fig.eje==='Re'){
      html += '<rect x="'+X(fig.a)+'" y="'+Y(ext)+'" width="'+(X(fig.b)-X(fig.a))+'" height="'+(Y(-ext)-Y(ext))+'" fill="'+fill+'"/>';
      html += '<line x1="'+X(fig.a)+'" y1="'+Y(-ext)+'" x2="'+X(fig.a)+'" y2="'+Y(ext)+'" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,3"/>';
      html += '<line x1="'+X(fig.b)+'" y1="'+Y(-ext)+'" x2="'+X(fig.b)+'" y2="'+Y(ext)+'" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,3"/>';
      html += '<text x="'+(X(fig.a)+4)+'" y="'+(Y(ext)+12)+'" font-size="11" fill="#4c1d95">a='+fig.a+'</text>';
      html += '<text x="'+(X(fig.b)+4)+'" y="'+(Y(ext)+12)+'" font-size="11" fill="#4c1d95">b='+fig.b+'</text>';
    } else {
      html += '<rect x="'+X(-ext)+'" y="'+Y(fig.b)+'" width="'+(X(ext)-X(-ext))+'" height="'+(Y(fig.a)-Y(fig.b))+'" fill="'+fill+'"/>';
      html += '<line x1="'+X(-ext)+'" y1="'+Y(fig.a)+'" x2="'+X(ext)+'" y2="'+Y(fig.a)+'" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,3"/>';
      html += '<line x1="'+X(-ext)+'" y1="'+Y(fig.b)+'" x2="'+X(ext)+'" y2="'+Y(fig.b)+'" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,3"/>';
      html += '<text x="'+(X(ext)-50)+'" y="'+(Y(fig.a)-4)+'" font-size="11" fill="#4c1d95">b='+fig.b+'</text>';
      html += '<text x="'+(X(ext)-50)+'" y="'+(Y(fig.a)+14)+'" font-size="11" fill="#4c1d95">a='+fig.a+'</text>';
    }
  }
  svg.innerHTML = html;
}
function describeArco(cx, cy, r, ang1, ang2){
  var a1 = ang1 * Math.PI/180, a2 = ang2 * Math.PI/180;
  var x1 = cx + r*Math.cos(a1), y1 = cy - r*Math.sin(a1);
  var x2 = cx + r*Math.cos(a2), y2 = cy - r*Math.sin(a2);
  var large = (ang2-ang1) > 180 ? 1 : 0;
  return '<path d="M '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 0 '+x2+' '+y2+'" fill="none" stroke="#b45309" stroke-width="1.5"/>';
}

// ============ UI ============
function nuevoEjercicio(){
  ejercicio = genComplejos();
  yaVerificado = false;
  var enun = document.getElementById('enunciado');
  enun.innerHTML =
    '<div class="texto-prob">' + ejercicio.problema + '</div>' +
    '<div class="esquema-wrap">' +
      '<svg class="esquema" id="esquema" viewBox="0 0 300 300" tabindex="0" aria-label="Plano de Argand del ejercicio"></svg>' +
      '<div class="caption">Plano de Argand · arrastra para inspeccionar</div>' +
    '</div>';
  tiposet(enun);
  dibujarEsquema();
  var inp = document.getElementById('respuesta');
  inp.value = ''; inp.classList.remove('mal'); inp.focus();
  var fb = document.getElementById('feedback');
  fb.className = 'feedback'; fb.innerHTML = '';
  var pb = document.getElementById('pistaBox');
  pb.className = 'panel pista'; pb.innerHTML = '';
  document.getElementById('btnPista').setAttribute('aria-pressed','false');
  var eb = document.getElementById('explicacionBox');
  eb.className = 'panel explicacion'; eb.innerHTML = '';
  document.getElementById('btnExplicacion').setAttribute('aria-pressed','false');
}
function verificar(){
  if(!ejercicio) return;
  var entradaRaw = document.getElementById('respuesta').value;
  if(!entradaRaw.trim()){
    var fb = document.getElementById('feedback');
    fb.className = 'feedback err visible';
    fb.innerHTML = '<div class="titulo">Escribe una respuesta antes de verificar.</div>';
    var inp = document.getElementById('respuesta');
    inp.classList.add('mal');
    setTimeout(function(){ inp.classList.remove('mal'); }, 450);
    intentos++; pintarMarcador(); guardarMarcador();
    return;
  }
  if(yaVerificado){
    // idempotente: no incrementar
    var fb2 = document.getElementById('feedback');
    fb2.classList.add('visible');
    var btnNuevo = document.getElementById('btnNuevo');
    btnNuevo.style.transform = 'scale(1.05)';
    setTimeout(function(){ btnNuevo.style.transform = ''; }, 250);
    return;
  }
  var entrada = entradaRaw.trim()
    .replace(/^\s*[a-zA-Z]\s*=\s*/,'')
    .replace(/^\s*[a-zA-Z]\s*<=\s*/,'')
    .replace(/^\s*[a-zA-Z]\s*>=\s*/,'')
    .replace(/^\s*[a-zA-Z]\s*≤\s*/,'')
    .replace(/^\s*[a-zA-Z]\s*≥\s*/,'')
    .trim();
  intentos++;
  var ok = false;
  if(ejercicio.tipo === 'numerica'){
    var num = aNumero(entrada);
    if(!isNaN(num) && Math.abs(num - ejercicio.respuesta) <= ejercicio.tolerancia) ok = true;
    else if(coincideTexto(entrada, ejercicio.acepta)) ok = true;
    else if(ejercicio.ang !== undefined && coincideAngulo(entrada, ejercicio.ang, ejercicio.tolerancia)) ok = true;
  } else {
    ok = coincideTexto(entrada, ejercicio.acepta);
    if(!ok && ejercicio.re !== undefined && ejercicio.im !== undefined){
      // complejo
      ok = coincideComplejo(entrada, ejercicio.re, ejercicio.im, ejercicio.tolerancia);
    }
    if(!ok && ejercicio.r !== undefined && ejercicio.ang !== undefined){
      // polar
      ok = coincidePolar(entrada, ejercicio.r, ejercicio.ang, ejercicio.tolerancia);
    }
    if(!ok && ejercicio.re !== undefined && ejercicio.im !== undefined && ejercicio.extraR !== undefined){
      // lugar geométrico circular: aceptar (centro, radio)
      // intenta parsear como "(a,b), r" o "a,b,r"
      var m = entrada.match(/^\(?\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\)?\s*,?\s*r?\s*=?\s*(-?\d+(?:\.\d+)?)/i);
      if(m){
        var pr = aNumero(m[1]), pi = aNumero(m[2]), prr = aNumero(m[3]);
        if(!isNaN(pr) && !isNaN(pi) && !isNaN(prr) &&
           Math.abs(pr-ejercicio.re)<=0.01 && Math.abs(pi-ejercicio.im)<=0.01 && Math.abs(prr-ejercicio.extraR)<=0.01){
          ok = true;
        }
      }
    }
  }
  var fb = document.getElementById('feedback');
  if(ok){
    aciertos++; racha++; yaVerificado = true;
    fb.className = 'feedback ok visible';
    fb.innerHTML =
      '<div class="titulo" style="font-weight:600;">✓ ¡Correcto!</div>' +
      '<div>Escribiste: <code>' + escaparHTML(entradaRaw.trim()) + '</code></div>' +
      '<div>En notación matemática: $' + ejercicio.respuestaLaTeX + '$</div>';
    tiposet(fb);
  } else {
    racha = 0;
    var msgs = [
      'Revisa el cuadrante del argumento y la convención declarada.',
      'Verifica que elevaste al cuadrado con paréntesis en los negativos.',
      'Comprueba unidades y formato de la respuesta (grados vs radianes).',
      '¿Estás usando $i^2 = -1$ correctamente en el producto?',
      'Recuerda: el módulo siempre es positivo; el argumento va en $(-180^{\\circ},180^{\\circ}]$.'
    ];
    var consejo = azar(msgs);
    fb.className = 'feedback err visible';
    fb.innerHTML = '<div class="titulo">✗ Todavía no</div><div>' + consejo + '</div>';
    tiposet(fb);
  }
  historial.push(ok?1:0);
  if(historial.length > 16) historial = historial.slice(-16);
  pintarMarcador();
  guardarMarcador();
}
function mostrarPista(){
  if(!ejercicio) return;
  var p = document.getElementById('pistaBox');
  var visible = p.classList.contains('visible');
  if(visible){
    p.classList.remove('visible'); p.innerHTML = '';
    document.getElementById('btnPista').setAttribute('aria-pressed','false');
  } else {
    p.innerHTML = ejercicio.pista; p.classList.add('visible');
    document.getElementById('btnPista').setAttribute('aria-pressed','true');
    tiposet(p);
  }
}
function mostrarExplicacion(){
  if(!ejercicio) return;
  var e = document.getElementById('explicacionBox');
  var visible = e.classList.contains('visible');
  if(visible){
    e.classList.remove('visible'); e.innerHTML = '';
    document.getElementById('btnExplicacion').setAttribute('aria-pressed','false');
  } else {
    var pasos = ejercicio.explicacion.split('\n');
    var html = '<ul class="pasos">';
    for(var i=0;i<pasos.length;i++){
      var paso = pasos[i];
      html += '<li class="paso">' + paso + '</li>';
    }
    html += '</ul><div class="respuesta-final">Respuesta: ' + ejercicio.solucion + '</div>';
    e.innerHTML = html; e.classList.add('visible');
    document.getElementById('btnExplicacion').setAttribute('aria-pressed','true');
    tiposet(e);
  }
}
function pintarMarcador(){
  document.getElementById('mArc').textContent = aciertos;
  document.getElementById('mInt').textContent = intentos;
  document.getElementById('mRacha').textContent = racha;
  var hist = document.getElementById('historial');
  var html = '';
  for(var i=0;i<16;i++){
    if(i<historial.length){
      html += '<span class="punto '+(historial[i]?'ok':'err')+'"></span>';
    } else {
      html += '<span class="punto vacio"></span>';
    }
  }
  hist.innerHTML = html;
}
function guardarMarcador(){
  try{
    localStorage.setItem('complejos_marker', JSON.stringify({aciertos:aciertos, intentos:intentos, racha:racha, historial:historial}));
  }catch(e){}
}
function cargarMarcador(){
  try{
    var s = localStorage.getItem('complejos_marker');
    if(s){
      var d = JSON.parse(s);
      aciertos = d.aciertos||0; intentos = d.intentos||0;
      racha = d.racha||0; historial = d.historial||[];
    }
  }catch(e){}
}
function reiniciarMarcador(){
  aciertos = 0; intentos = 0; racha = 0; historial = [];
  pintarMarcador(); guardarMarcador();
}

// ============ EVENTOS ============
document.getElementById('btnNuevo').addEventListener('click', nuevoEjercicio);
document.getElementById('btnVerificar').addEventListener('click', verificar);
document.getElementById('btnPista').addEventListener('click', mostrarPista);
document.getElementById('btnExplicacion').addEventListener('click', mostrarExplicacion);
document.getElementById('btnReset').addEventListener('click', reiniciarMarcador);
document.getElementById('respuesta').addEventListener('keydown', function(e){
  if(e.key === 'Enter' || (e.keyCode || e.which) === 13) verificar();
});
document.addEventListener('keydown', function(e){
  var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
  if((e.key === 'n' || e.key === 'N') && tag !== 'input' && tag !== 'textarea') nuevoEjercicio();
});
// Arrastre del esquema (pan simple para inspección)
(function(){
  var svg = null, dragging = false, sx = 0, sy = 0, panX = 0, panY = 0;
  document.addEventListener('mousedown', function(e){
    if(e.target && e.target.id === 'esquema'){
      svg = e.target; dragging = true; sx = e.clientX; sy = e.clientY;
      svg.setPointerCapture && svg.setPointerCapture(e.pointerId || 1);
    }
  });
  document.addEventListener('mousemove', function(e){
    if(!dragging || !svg) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    svg.style.transform = 'translate('+(panX+dx)+'px, '+(panY+dy)+'px)';
  });
  document.addEventListener('mouseup', function(e){
    if(dragging && svg){
      panX += e.clientX - sx; panY += e.clientY - sy;
      dragging = false;
    }
  });
})();

// ============ ARRANQUE ============
cargarMarcador();
pintarMarcador();
nuevoEjercicio();
</script>
</body>
</html>
